<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>Calculadora Web</h1>
        <p>Sistema Flask Interativo</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="n1">Primeiro Valor</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-hashtag"></i>
                <input type="number" step="any" id="n1" name="n1" value="{{ n1 }}" required placeholder="0">
            </div>
        </div>

        <div class="form-group">
            <label for="n2">Segundo Valor</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-hashtag"></i>
                <input type="number" step="any" id="n2" name="n2" value="{{ n2 }}" required placeholder="0">
            </div>
        </div>

        <div class="operations-grid">
            <button type="submit" name="operacao" value="somar" class="btn btn-op">
                <i class="fa-solid fa-plus"></i> Somar
            </button>
            <button type="submit" name="operacao" value="diminuir" class="btn btn-op">
                <i class="fa-solid fa-minus"></i> Subtrair
            </button>
            <button type="submit" name="operacao" value="multiplicar" class="btn btn-op">
                <i class="fa-solid fa-xmark"></i> Multiplicar
            </button>
            <button type="submit" name="operacao" value="dividir" class="btn btn-op">
                <i class="fa-solid fa-divide"></i> Dividir
            </button>
            <button type="submit" name="operacao" value="todas" class="btn btn-all">
                <i class="fa-solid fa-bolt"></i> Executar Todas
            </button>
        </div>
    </form>

    {% if resultado %}
        <div class="alert alert-success">
            <i class="fa-solid fa-square-check"></i> {{ resultado }}
        </div>
    {% endif %}

    {% if erro %}
        <div class="alert alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ erro }}
        </div>
    {% endif %}

    <div class="history-section">
        <div class="history-title">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Histórico</h3>
        </div>

        {% if historico %}
            <ul class="history-list">
                {% for item in historico %}
                    <li class="history-item">
                        <i class="fa-solid fa-angle-right" style="font-size: 0.7rem; color: #818cf8;"></i> {{ item }}
                    </li>
                {% endfor %}
            </ul>
            <form method="POST">
                <button type="submit" name="operacao" value="limpar_historico" class="btn btn-clear">
                    <i class="fa-solid fa-trash-can"></i> Limpar Histórico
                </button>
            </form>
        {% else %}
            <p class="empty-history">Nenhuma operação realizada ainda.</p>
        {% endif %}
    </div>
</div>

</body>
</html>
